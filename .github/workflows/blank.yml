name: Full Project Initialization
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Folders
        run: |
          mkdir -p kernel/src
          mkdir -p android/app/src/main/java/com/aetheria/loader
          mkdir -p android/app/src/main/cpp
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/raw

      - name: Write Kernel Files (Full Code)
