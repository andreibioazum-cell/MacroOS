name: Build AetheriaOS APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 ndk;25.2.9519653'

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          target: aarch64-unknown-none
          override: true
          components: rust-src

      # 1. ГАРАНТИРОВАННОЕ СОЗДАНИЕ ВСЕХ ФАЙЛОВ ЯДРА
      - name: Inject Kernel Source Code
        run: |
          mkdir -p kernel/src
          
          # ФАЙЛ ШРИФТА
          cat > kernel/src/font.rs << 'EOF'
          pub fn get_char_bitmap(c: char) -> [u8; 8] {
              let idx = c as usize;
              if idx >= 32 && idx <= 126 { FONT_DATA[idx - 32] } else { [0xFF; 8] }
          }
