name: Initialize Project Files
on: workflow_dispatch # Запуск вручную

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Directory Structure
        run: |
          mkdir -p kernel/src
          mkdir -p android/app/src/main/java/com/aetheria/loader
          mkdir -p android/app/src/main/cpp
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/raw

      - name: Create Kernel Files (Rust)
        run: |
          # 1. Cargo.toml
          cat > kernel/Cargo.toml << 'EOF'
          [package]
          name = "aetheria_kernel"
          version = "0.5.0"
          edition = "2021"

          [lib]
          crate-type = ["staticlib"]

          [profile.release]
          opt-level = 3
          panic = "abort"
          EOF

          # 2. Linker Script
          cat > kernel/linker.ld << 'EOF'
          ENTRY(aetheria_main)
          SECTIONS {
              . = 0x00000000;
              .text : { *(.text.entry) *(.text*) }
              .rodata : { *(.rodata*) }
              .data : { *(.data*) }
              .bss : { *(.bss*) *(COMMON) }
              /DISCARD/ : { *(.eh_frame) *(.comment) }
          }
          EOF

          # 3. Graphics Module
          cat > kernel/src/vga.rs << 'EOF'
          use core::ptr::write_volatile;
          use crate::font;

          pub unsafe fn draw_rect(fb: *mut u32, fb_w: u32, x: u32, y: u32, w: u32, h: u32, color: u32) {
              for iy in y..(y + h) {
                  for ix in x..(x + w) {
                      write_volatile(fb.add((iy * fb_w + ix) as usize), color);
                  }
              }
          }

          pub unsafe fn draw_char(fb: *mut u32, fb_w: u32, x: u32, y: u32, c: char, color: u32, scale: u32) {
              let bitmap = font::get_char_bitmap(c);
              for row in 0..8 {
                  for col in 0..8 {
                      if (bitmap[row] & (1 << (7 - col))) != 0 {
                          draw_rect(fb, fb_w, x + col * scale, y + (row as u32) * scale, scale, scale, color);
                      }
                  }
              }
          }

          pub unsafe fn draw_text(fb: *mut u32, fb_w: u32, x: u32, y: u32, text: &str, color: u32, scale: u32) {
              let mut cx = x;
              for c in text.chars() {
                  draw_char(fb, fb_w, cx, y, c, color, scale);
                  cx += 8 * scale;
              }
          }
          EOF

          # 4. Virtual Machine Module
          cat > kernel/src/vm.rs << 'EOF'
          use core::str;
          use core::ptr::{read_volatile, write_volatile};
          use crate::vga;

          pub struct AetherVM {
              regs: [i32; 26],
              mem: [i32; 1024],
              seed: u32,
          }

          impl AetherVM {
              pub fn new() -> Self {
                  Self { regs: [0; 26], mem: [0; 1024], seed: 12345 }
              }

              fn get_val(&self, s: &str) -> i32 {
                  let b = s.as_bytes();
                  if b.len() == 1 && b[0] >= b'a' && b[0] <= b'z' { return self.regs[(b[0] - b'a') as usize]; }
                  s.parse::<i32>().unwrap_or(0)
              }

              pub unsafe fn run(&mut self, fb: *mut u32, kb: *mut u8, w: u32, h: u32, code: &str) {
                  let lines: core::alloc::vec::Vec<&str> = code.lines().filter(|l| !l.is_empty() && !l.starts_with("//")).collect();
                  let mut pc = 0;
                  let colors = [0xFF0D0D14, 0xFFFFFFFF, 0xFF4AF626, 0xFFF38BA8, 0xFF89B4FA, 0xFFF9E2AF, 0xFF94E2D5];

                  while pc < lines.len() {
                      let key = read_volatile(kb);
                      if key != 0 { write_volatile(kb, 0); }

                      let mut jumped = false;
                      let parts: core::alloc::vec::Vec<&str> = lines[pc].split_whitespace().collect();
                      if parts.is_empty() { pc += 1; continue; }

                      match parts[0] {
                          "set" => { self.regs[(parts[1].as_bytes()[0] - b'a') as usize] = self.get_val(parts[2]); }
                          "clear" => { vga::draw_rect(fb, w, 0, 0, w, h, colors[self.get_val(parts[1]) as usize % 7]); }
                          "text" => { vga::draw_text(fb, w, self.get_val(parts[1]) as u32, self.get_val(parts[2]) as u32, parts[4], colors[self.get_val(parts[3]) as usize % 7], 2); }
                          "jmp" => { pc = self.get_val(parts[1]) as usize; jumped = true; }
                          "exit" => break,
                          _ => {}
                      }
                      if !jumped { pc += 1; }
                  }
              }
          }
          EOF

          # 5. Main Kernel File
          cat > kernel/src/lib.rs << 'EOF'
          #![no_std]
          #![no_main]

          mod font;
          mod vga;
          mod vm;

          use core::panic::PanicInfo;
          use core::ptr::{read_volatile, write_volatile};

          #[panic_handler]
          fn panic(_info: &PanicInfo) -> ! { loop {} }

          #[no_mangle]
          pub unsafe extern "C" fn aetheria_main(fb: *mut u32, kb: *mut u8, width: u32, height: u32) -> ! {
              let bg = 0xFF0D0D14;
              let green = 0xFF4AF626;
              vga::draw_rect(fb, width, 0, 0, width, height, bg);
              vga::draw_text(fb, width, 20, 20, "AetheriaOS v0.5 - Ready", green, 2);

              loop {
                  // Основной цикл оболочки
                  core::hint::spin_loop();
              }
          }
          EOF
          
          # 6. Font (бинарные данные)
          cat > kernel/src/font.rs << 'EOF'
