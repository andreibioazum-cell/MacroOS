name: Build AetheriaOS APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 ndk;25.2.9519653'

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          target: aarch64-unknown-none
          override: true
          components: rust-src

      # 1. СОЗДАЕМ ВСЮ СТРУКТУРУ ПРОЕКТА С НУЛЯ
      - name: Inject Project Structure
        run: |
          # Папки ядра
          mkdir -p kernel/src
          # Папки Android
          mkdir -p android/app/src/main/java/com/aetheria/loader
          mkdir -p android/app/src/main/cpp
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/raw

          # --- КОРНЕВЫЕ ГРАДЛ ФАЙЛЫ ---
          cat > android/settings.gradle << 'EOF'
          include ':app'
          EOF

          cat > android/gradle.properties << 'EOF'
          android.useAndroidX=true
          EOF

          cat > android/build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # --- МОДУЛЬ APP ---
          cat > android/app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.aetheria.loader'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.aetheria.loader'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  externalNativeBuild { cmake { cppFlags "-O3 -fPIC" } }
              }
              externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt" } }
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="AetheriaOS" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity android:name="com.aetheria.loader.MainActivity" android:exported="true" android:screenOrientation="landscape">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # --- C++ ЧАСТЬ (JNI) ---
          cat > android/app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(aetheria_loader)
          add_library(aetheria_loader SHARED loader.cpp)
          target_link_libraries(aetheria_loader log)
          EOF

          cat > android/app/src/main/cpp/loader.cpp << 'EOF'
          #include <jni.h>
          #include <sys/mman.h>
          #include <cstring>
          extern "C" JNIEXPORT void JNICALL Java_com_aetheria_loader_MainActivity_startKernel(JNIEnv* env, jobject, jbyteArray kernelData, jobject fb, jobject kb, jint w, jint h) {
              jsize len = env->GetArrayLength(kernelData);
              jbyte* bytes = env->GetByteArrayElements(kernelData, nullptr);
              void* fb_ptr = env->GetDirectBufferAddress(fb);
              void* kb_ptr = env->GetDirectBufferAddress(kb);
              void* exec_mem = mmap(nullptr, len, PROT_READ | PROT_WRITE | PROT_EXEC, MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
              memcpy(exec_mem, bytes, len);
              ((void (*)(void*, void*, int, int))exec_mem)(fb_ptr, kb_ptr, w, h);
          }
          EOF

          # --- JAVA ЧАСТЬ ---
          cat > android/app/src/main/java/com/aetheria/loader/MainActivity.java << 'EOF'
          package com.aetheria.loader;
          import android.app.Activity;
          import android.graphics.*;
          import android.os.Bundle;
          import android.view.*;
          import java.nio.ByteBuffer;
          public class MainActivity extends Activity {
              static { System.loadLibrary("aetheria_loader"); }
              private native void startKernel(byte[] d, ByteBuffer fb, ByteBuffer kb, int w, int h);
              private ByteBuffer frameBuffer, kbBuffer; private Bitmap bitmap; private SurfaceView surface;
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main); surface = findViewById(R.id.surface);
                  frameBuffer = ByteBuffer.allocateDirect(1280 * 720 * 4);
                  kbBuffer = ByteBuffer.allocateDirect(1);
                  bitmap = Bitmap.createBitmap(1280, 720, Bitmap.Config.ARGB_8888);
                  surface.getHolder().addCallback(new SurfaceHolder.Callback() {
                      @Override public void surfaceCreated(SurfaceHolder h) {
                          new Thread(() -> { try { byte[] k = getResources().openRawResource(R.raw.kernel_bin).readAllBytes(); startKernel(k, frameBuffer, kbBuffer, 1280, 720); } catch(Exception e) {} }).start();
                          new Thread(() -> { while(true) { Canvas c = h.lockCanvas(); if (c != null) { frameBuffer.position(0); bitmap.copyPixelsFromBuffer(frameBuffer); c.drawBitmap(bitmap, null, new Rect(0,0, surface.getWidth(), surface.getHeight()), null); h.unlockCanvasAndPost(c); } try { Thread.sleep(16); } catch(Exception e){} } }).start();
                      }
                      @Override public void surfaceChanged(SurfaceHolder h, int f, int w, int h2) {}
                      @Override public void surfaceDestroyed(SurfaceHolder h) {}
                  });
              }
          }
          EOF

          # --- LAYOUT ---
          cat > android/app/src/main/res/layout/activity_main.xml << 'EOF'
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000">
              <SurfaceView android:id="@+id/surface" android:layout_width="match_parent" android:layout_height="match_parent" />
              <Button android:id="@+id/btnW" android:layout_width="60dp" android:layout_height="60dp" android:text="W" android:layout_alignParentBottom="true" android:layout_centerHorizontal="true"/>
              <Button android:id="@+id/btnS" android:layout_width="60dp" android:layout_height="60dp" android:text="S" android:layout_alignParentBottom="true" android:layout_centerHorizontal="true" android:layout_marginBottom="60dp"/>
          </RelativeLayout>
          EOF

      # 2. СОЗДАЕМ КОД ЯДРА
      - name: Inject Kernel Code
        run: |
          cat > kernel/Cargo.toml << 'EOF'
          [package]
          name = "aetheria_kernel"
          version = "0.1.0"
          edition = "2021"
          [lib]
          crate-type = ["staticlib"]
          [profile.release]
          opt-level = 3
          panic = "abort"
          EOF

          cat > kernel/linker.ld << 'EOF'
          ENTRY(aetheria_main);
          SECTIONS { . = 0x00000000; .text : { *(.text.entry) *(.text*) } .rodata : { *(.rodata*) } .data : { *(.data*) } .bss : { *(.bss*) *(COMMON) } /DISCARD/ : { *(.eh_frame) *(.comment) } }
          EOF

          cat > kernel/src/lib.rs << 'EOF'
          #![no_std]
          use core::panic::PanicInfo;
          use core::ptr::{read_volatile, write_volatile};
          #[panic_handler] fn panic(_i: &PanicInfo) -> ! { loop {} }
          #[no_mangle] pub unsafe extern "C" fn aetheria_main(fb: *mut u32, kb: *mut u8, w: u32, h: u32) -> ! {
              for i in 0..(w*h) { write_volatile(fb.add(i as usize), 0xFF0D0D14); }
              loop { core::hint::spin_loop(); }
          }
          EOF

      # 3. СБОРКА ЯДРА
      - name: Build Rust Kernel
        run: |
          cd kernel
          cargo build --release --target aarch64-unknown-none
          NDK_BIN=$(find $ANDROID_HOME/ndk -name "ld.lld" | head -n 1 | xargs dirname)
          OBJCOPY=$(find $ANDROID_HOME/ndk -name "llvm-objcopy" | head -n 1)
          $NDK_BIN/ld.lld -T linker.ld -o kernel.elf target/aarch64-unknown-none/release/libaetheria_kernel.a
          $OBJCOPY -O binary kernel.elf kernel.bin
          mkdir -p ../android/app/src/main/res/raw
          cp kernel.bin ../android/app/src/main/res/raw/kernel_bin

      # 4. СБОРКА APK
      - name: Build Android APK
        run: |
          cd android
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AetheriaOS-AutoBuild
          path: android/app/build/outputs/apk/debug/app-debug.apk
