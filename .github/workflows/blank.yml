name: Build AetheriaOS APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 ndk;25.2.9519653'

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          target: aarch64-unknown-none
          override: true
          components: rust-src

      # 1. ГАРАНТИРУЕМ НАЛИЧИЕ ВСЕХ ФАЙЛОВ ПЕРЕД СБОРКОЙ
      - name: Verify and Repair Project Structure
        run: |
          mkdir -p android/app/src/main/res/raw
          mkdir -p android/app/src/main/cpp
          
          # Проверяем Manifest (если пропал - создаем)
          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "Repairing Manifest..."
            mkdir -p android/app/src/main
            cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="AetheriaOS" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity android:name="com.aetheria.loader.MainActivity" android:exported="true" android:screenOrientation="landscape">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          fi

          # Проверяем CMakeLists.txt для C++ части
          if [ ! -f "android/app/src/main/cpp/CMakeLists.txt" ]; then
            cat > android/app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(aetheria_loader)
          add_library(aetheria_loader SHARED loader.cpp)
          target_link_libraries(aetheria_loader log)
          EOF
          fi

      # 2. СБОРКА ЯДРА (Rust)
      - name: Build Rust Kernel
        run: |
          cd kernel
          cargo build --release --target aarch64-unknown-none
          
          # Путь к инструментам NDK
          NDK_BIN=$(find $ANDROID_HOME/ndk -name "ld.lld" | head -n 1 | xargs dirname)
          OBJCOPY=$(find $ANDROID_HOME/ndk -name "llvm-objcopy" | head -n 1)
          
          # Линковка
          $NDK_BIN/ld.lld -T linker.ld -o kernel.elf target/aarch64-unknown-none/release/libaetheria_kernel.a
          $OBJCOPY -O binary kernel.elf kernel.bin
          
          # Копируем в ресурсы Android
          cp kernel.bin ../android/app/src/main/res/raw/kernel_bin

      # 3. СБОРКА ANDROID (APK)
      - name: Build Android APK
        run: |
          cd android
          # Создаем базовые файлы Gradle если их нет
          if [ ! -f "settings.gradle" ]; then echo "include ':app'" > settings.gradle; fi
          if [ ! -f "build.gradle" ]; then
            cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          fi

          # Сборка
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 4. ВЫГРУЗКА РЕЗУЛЬТАТА
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AetheriaOS-Built
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            kernel/kernel.bin
