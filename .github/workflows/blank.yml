name: AetheriaOS_Minimal
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;25.2.9519653'

      - name: Build Bare-Metal Kernel
        run: |
          mkdir -p kernel
          cat > kernel/kernel.c << 'EOF'
          typedef unsigned int u32;
          void kmain(u32* fb, unsigned char* kb, int w, int h) {
              u32 x=500, y=300, color=0xFF4AF626; 
              for(int i=0; i<w*h; i++) fb[i] = 0xFF0D0D14; // Очистка фона
              while(1) {
                  // Рисуем квадрат 40x40
                  for(int i=0; i<40; i++) 
                      for(int j=0; j<40; j++) 
                          if((y+i)<h && (x+j)<w) fb[(y+i)*w + (x+j)] = color;
                  
                  unsigned char key = *kb;
                  if(key != 0) {
                      // Стираем старый квадрат перед движением
                      for(int i=0; i<40; i++) for(int j=0; j<40; j++) fb[(y+i)*w + (x+j)] = 0xFF0D0D14;
                      if(key == 'w') y -= 10; if(key == 's') y += 10;
                      if(key == 'a') x -= 10; if(key == 'd') x += 10;
                      *kb = 0; // Сброс клавиши
                  }
                  for(volatile int i=0; i<100000; i++); // Задержка
              }
          }
          EOF
          
          # Находим пути к инструментам NDK
          NDK_TOOLCHAIN=$(find $ANDROID_HOME/ndk -name "bin" -type d | grep "llvm" | head -n 1)
          CLANG=$NDK_TOOLCHAIN/aarch64-linux-android33-clang
          LLD=$NDK_TOOLCHAIN/ld.lld
          OBJCOPY=$NDK_TOOLCHAIN/llvm-objcopy
          
          # Компиляция в чистый бинарник
          $CLANG -target aarch64-none-elf -O3 -ffreestanding -nostdlib -c kernel/kernel.c -o kernel.o
          $LLD kernel.o -o kernel.elf --section-start .text=0x0 --entry=kmain
          $OBJCOPY -O binary kernel.elf kernel.bin

      - name: Create Android Wrapper
        run: |
          mkdir -p app/src/main/{java/com/aetheria/os,cpp,res/layout,res/raw}
          cp kernel.bin app/src/main/res/raw/kernel_bin
          
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#000">
              <SurfaceView android:id="@+id/s" android:layout_width="match_parent" android:layout_height="match_parent" />
              <GridLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_alignParentBottom="true" android:columnCount="3">
                  <View android:layout_width="60dp"/><Button android:id="@+id/w" android:text="W" android:layout_width="60dp"/><View />
                  <Button android:id="@+id/a" android:text="A" android:layout_width="60dp"/><Button android:id="@+id/s_btn" android:text="S" android:layout_width="60dp"/><Button android:id="@+id/d" android:text="D" android:layout_width="60dp"/>
              </GridLayout>
          </RelativeLayout>
          EOF

          cat > app/src/main/java/com/aetheria/os/MainActivity.java << 'EOF'
          package com.aetheria.os;
          import android.app.Activity;
          import android.graphics.*;
          import android.os.Bundle;
          import android.view.*;
          import android.widget.Button;
          import java.nio.ByteBuffer;

          public class MainActivity extends Activity {
              static { System.loadLibrary("loader"); }
              native void start(byte[] k, ByteBuffer fb, ByteBuffer kb, int w, int h);
              ByteBuffer fb = ByteBuffer.allocateDirect(1280*720*4), kb = ByteBuffer.allocateDirect(1);
              Bitmap bm = Bitmap.createBitmap(1280, 720, Bitmap.Config.ARGB_8888);

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  SurfaceView sv = findViewById(R.id.s);
                  int[] ids = {R.id.w, R.id.a, R.id.s_btn, R.id.d};
                  char[] keys = {'w', 'a', 's', 'd'};
                  for(int i=0; i<4; i++) {
                      final char k = keys[i];
                      findViewById(ids[i]).setOnClickListener(v -> kb.put(0, (byte)k));
                  }
                  sv.getHolder().addCallback(new SurfaceHolder.Callback() {
                      public void surfaceCreated(SurfaceHolder h) {
                          new Thread(() -> { try {
                              java.io.InputStream is = getResources().openRawResource(R.raw.kernel_bin);
                              byte[] k = new byte[is.available()]; is.read(k);
                              start(k, fb, kb, 1280, 720);
                          } catch(Exception e){} }).start();
                          new Thread(() -> { while(true) {
                              Canvas c = h.lockCanvas();
                              if(c != null) { fb.position(0); bm.copyPixelsFromBuffer(fb); 
                              c.drawBitmap(bm, null, new Rect(0,0,sv.getWidth(),sv.getHeight()), null); h.unlockCanvasAndPost(c); }
                              try { Thread.sleep(16); } catch(Exception e){}
                          } }).start();
                      }
                      public void surfaceChanged(SurfaceHolder h, int f, int w, int h2) {}
                      public void surfaceDestroyed(SurfaceHolder h) {}
                  });
              }
          }
          EOF

          cat > app/src/main/cpp/loader.cpp << 'EOF'
          #include <jni.h>
          #include <string.h>
          #include <sys/mman.h>
          extern "C" JNIEXPORT void JNICALL Java_com_aetheria_os_MainActivity_start(JNIEnv* env, jobject o, jbyteArray k, jobject fb, jobject kb, jint w, jint h) {
              jsize len = env->GetArrayLength(k);
              void* m = mmap(0, len, PROT_READ|PROT_WRITE|PROT_EXEC, MAP_PRIVATE|MAP_ANONYMOUS, -1, 0);
              env->GetByteArrayRegion(k, 0, len, (jbyte*)m);
              ((void(*)(void*, void*, int, int))m)(env->GetDirectBufferAddress(fb), env->GetDirectBufferAddress(kb), (int)w, (int)h);
          }
          EOF

          echo "project(loader)" > app/src/main/cpp/CMakeLists.txt
          echo "add_library(loader SHARED loader.cpp)" >> app/src/main/cpp/CMakeLists.txt
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.aetheria.os"><application android:label="AetheriaTiny" android:theme="@android:style/Theme.NoTitleBar.Fullscreen"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android { namespace 'com.aetheria.os'; compileSdk 34; defaultConfig { minSdk 24 }; externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } } }" >> app/build.gradle
          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }" > build.gradle
          echo "include ':app'" > settings.gradle

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          ./gradle-8.5/bin/gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AetheriaOS-Final
          path: app/build/outputs/apk/debug/app-debug.apk
