name: AetheriaOS_V3_Android14
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Compilers
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Build Bare-Metal Kernel
        run: |
          mkdir -p kernel
          cat > kernel/kernel.c << 'EOF'
          typedef unsigned int u32;
          void draw_rect(u32* fb, int w, int x, int y, int rw, int rh, u32 col) {
              for(int i=0; i<rh; i++) for(int j=0; j<rw; j++) 
                  if(y+i<720 && x+j<1280) fb[(y+i)*w + (x+j)] = col;
          }
          int mode = 0; // 0: Shell, 1: Snake, 2: HTML
          int sx[100], sy[100], slen=8, sdir=1; 
          void kmain(u32* fb, unsigned char* kb, int w, int h) {
              for(int i=0; i<slen; i++) { sx[i]=200-(i*10); sy[i]=200; }
              while(1) {
                  unsigned char k = *kb;
                  if(k == '1') { mode = 1; for(int i=0; i<w*h; i++) fb[i]=0; }
                  if(k == '2') { mode = 2; }
                  if(k == '0') { mode = 0; for(int i=0; i<w*h; i++) fb[i]=0xFF1A1B26; }
                  if(mode == 1) { // Snake
                      draw_rect(fb, w, sx[slen-1], sy[slen-1], 12, 12, 0); // Clear tail
                      if(k=='w') sdir=0; if(k=='d') sdir=1; if(k=='s') sdir=2; if(k=='a') sdir=3;
                      for(int i=slen; i>0; i--) { sx[i]=sx[i-1]; sy[i]=sy[i-1]; }
                      if(sdir==0) sy[0]-=10; if(sdir==1) sx[0]+=10; if(sdir==2) sy[0]+=10; if(sdir==3) sx[0]-=10;
                      draw_rect(fb, w, sx[0], sy[0], 12, 12, 0xFF4AF626);
                  } else if(mode == 2) { // HTML
                      draw_rect(fb, w, 0, 0, 1280, 720, 0xFFFFFFFF);
                      draw_rect(fb, w, 100, 100, 400, 60, 0xFF007BFF); // Button
                      draw_rect(fb, w, 100, 200, 600, 10, 0xFF333333); // Text
                  } else draw_rect(fb, w, 20, 20, 5, 20, 0xFFFFFFFF); // Shell cursor
                  if(k != 0) *kb = 0;
                  for(volatile int i=0; i<300000; i++); 
              }
          }
          EOF
          clang -target aarch64-none-elf -O3 -ffreestanding -nostdlib -c kernel/kernel.c -o kernel.o
          ld.lld kernel.o -o kernel.bin --section-start .text=0x0 --oformat binary

      - name: Create Android App
        run: |
          mkdir -p app/src/main/{java/com/aether/os,cpp,res/layout,res/raw}
          cp kernel.bin app/src/main/res/raw/kernel_bin
          
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" 
              android:layout_width="match_parent" android:layout_height="match_parent" 
              android:orientation="vertical" android:background="#111">
              <EditText android:id="@+id/cmd" android:layout_width="match_parent" android:layout_height="60dp" 
                  android:hint="Type 1 (Snake), 2 (HTML), 0 (OS)" android:background="#EEE" android:textColor="#000"
                  android:padding="10dp" android:inputType="text" android:imeOptions="actionDone" android:focusable="true"/>
              <FrameLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1">
                  <SurfaceView android:id="@+id/s" android:layout_width="match_parent" android:layout_height="match_parent" />
                  <RelativeLayout android:layout_width="160dp" android:layout_height="160dp" 
                      android:layout_gravity="bottom|left" android:layout_margin="10dp">
                      <Button android:id="@+id/w" android:layout_width="50dp" android:layout_height="50dp" android:text="W" android:layout_centerHorizontal="true" android:alpha="0.7"/>
                      <Button android:id="@+id/a" android:layout_width="50dp" android:layout_height="50dp" android:text="A" android:layout_centerVertical="true" android:alpha="0.7"/>
                      <Button android:id="@+id/s_btn" android:layout_width="50dp" android:layout_height="50dp" android:text="S" android:layout_alignParentBottom="true" android:layout_centerHorizontal="true" android:alpha="0.7"/>
                      <Button android:id="@+id/d" android:layout_width="50dp" android:layout_height="50dp" android:text="D" android:layout_alignParentRight="true" android:layout_centerVertical="true" android:alpha="0.7"/>
                  </RelativeLayout>
              </FrameLayout>
          </LinearLayout>
          EOF

          cat > app/src/main/java/com/aether/os/MainActivity.java << 'EOF'
          package com.aether.os;
          import android.app.Activity;
          import android.graphics.*;
          import android.os.Bundle;
          import android.view.*;
          import android.widget.*;
          import java.nio.ByteBuffer;

          public class MainActivity extends Activity {
              static { System.loadLibrary("loader"); }
              native void start(byte[] k, ByteBuffer fb, ByteBuffer kb, int w, int h);
              ByteBuffer fb = ByteBuffer.allocateDirect(1280*720*4), kb = ByteBuffer.allocateDirect(1);
              Bitmap bm = Bitmap.createBitmap(1280, 720, Bitmap.Config.ARGB_8888);

              @Override protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  setContentView(R.layout.activity_main);
                  SurfaceView sv = findViewById(R.id.s);
                  EditText cmd = findViewById(R.id.cmd);

                  cmd.setOnEditorActionListener((v, a, e) -> {
                      String s = v.getText().toString();
                      if(!s.isEmpty()) kb.put(0, (byte)s.charAt(0));
                      v.setText(""); return true;
                  });

                  int[] ids={R.id.w, R.id.a, R.id.s_btn, R.id.d}; char[] keys={'w','a','s','d'};
                  for(int i=0; i<4; i++) {
                      final char c = keys[i];
                      findViewById(ids[i]).setOnTouchListener((v, e) -> { if(e.getAction()==0) kb.put(0, (byte)c); return false; });
                  }

                  sv.getHolder().addCallback(new SurfaceHolder.Callback() {
                      public void surfaceCreated(SurfaceHolder h) {
                          new Thread(() -> { try {
                              java.io.InputStream is = getResources().openRawResource(R.raw.kernel_bin);
                              byte[] k = new byte[is.available()]; is.read(k);
                              start(k, fb, kb, 1280, 720);
                          } catch(Exception e){} }).start();
                          new Thread(() -> { while(true) {
                              Canvas c = h.lockCanvas();
                              if(c != null) { fb.position(0); bm.copyPixelsFromBuffer(fb); 
                              c.drawBitmap(bm, null, new Rect(0,0,sv.getWidth(),sv.getHeight()), null); h.unlockCanvasAndPost(c); }
                              try { Thread.sleep(16); } catch(Exception e){}
                          } }).start();
                      }
                      public void surfaceChanged(SurfaceHolder h, int f, int w, int h2) {}
                      public void surfaceDestroyed(SurfaceHolder h) {}
                  });
              }
          }
          EOF

          cat > app/src/main/cpp/loader.cpp << 'EOF'
          #include <jni.h>
          #include <string.h>
          #include <sys/mman.h>
          extern "C" JNIEXPORT void JNICALL Java_com_aether_os_MainActivity_start(JNIEnv* env, jobject t, jbyteArray k, jobject fb, jobject kb, jint w, jint h) {
              jsize len = env->GetArrayLength(k);
              void* m = mmap(0, len, 7, MAP_PRIVATE|MAP_ANONYMOUS, -1, 0);
              env->GetByteArrayRegion(k, 0, len, (jbyte*)m);
              ((void(*)(void*, void*, int, int))m)(env->GetDirectBufferAddress(fb), env->GetDirectBufferAddress(kb), w, h);
          }
          EOF

          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
          echo "include ':app'" > settings.gradle
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android { 
              namespace 'com.aether.os'
              compileSdk 34
              defaultConfig { minSdk 24; targetSdk 34 }
              externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
          }
          EOF
          echo "project(loader)" > app/src/main/cpp/CMakeLists.txt
          echo "add_library(loader SHARED loader.cpp)" >> app/src/main/cpp/CMakeLists.txt
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.aether.os"><application android:label="AetheriaOS" android:theme="@android:style/Theme.NoTitleBar.Fullscreen"><activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          ./gradle-8.5/bin/gradle assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AetheriaOS-V3
          path: app/build/outputs/apk/debug/app-debug.apk
