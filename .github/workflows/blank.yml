name: Build AetheriaOS APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Настройка окружения
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 ndk;25.2.9519653'

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          target: aarch64-unknown-none
          override: true
          components: rust-src

      # 2. Сборка Ядра (Kernel)
      - name: Build Rust Kernel
        run: |
          cd kernel
          cargo build --release --target aarch64-unknown-none
          
          # Находим инструменты NDK для линковки
          NDK_PATH=$(find $ANDROID_HOME/ndk -maxdepth 1 -type d -name "2*" | head -n 1)
          LLD=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld
          OBJCOPY=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy
          
          # Линкуем ELF и переводим в сырой бинарник
          $LLD -T linker.ld -o kernel.elf target/aarch64-unknown-none/release/libaetheria_kernel.a
          $OBJCOPY -O binary kernel.elf kernel.bin
          
          # Копируем готовое ядро в ресурсы Андроида
          mkdir -p ../android/app/src/main/res/raw
          cp kernel.bin ../android/app/src/main/res/raw/kernel_bin

      # 3. Подготовка Android проекта (Gradle файлы)
      # Это на случай, если их нет в репозитории
      - name: Prepare Gradle root files
        run: |
          cd android
          if [ ! -f "build.gradle" ]; then
            cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          fi
          
          if [ ! -f "settings.gradle" ]; then
            echo "include ':app'" > settings.gradle
          fi
          
          if [ ! -f "gradle.properties" ]; then
            echo "android.useAndroidX=true" > gradle.properties
          fi

      # 4. Сборка APK
      - name: Build Android APK
        run: |
          cd android
          # Устанавливаем Gradle обертку если её нет
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle wrapper --gradle-version 8.5
          
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 5. Сохранение результата
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AetheriaOS-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
