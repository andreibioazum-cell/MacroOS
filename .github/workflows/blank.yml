E,0x66,0x66,0x00],[0x3C,0x66,0x66,0x66,0x66,0x66,0x3C,0x00],[0x7C,0x66,0x66,0x7C,0x60,0x60,0x60,0x00],[0x3C,0x66,0x66,0x66,0x66,0x3C,0x0E,0x00],[0x7C,0x66,0x66,0x7C,0x78,0x6C,0x66,0x00],[0x3C,0x66,0x60,0x3C,0x06,0x66,0x3C,0x00],[0x7E,0x18,0x18,0x18,0x18,0x18,0x18,0x00],[0x66,0x66,0x66,0x66,0x66,0x66,0x3C,0x00],[0x66,0x66,0x66,0x66,0x66,0x3C,0x18,0x00],[0x63,0x63,0x6B,0x7F,0x77,0x63,0x63,0x00],[0x66,0x66,0x3C,0x18,0x3C,0x66,0x66,0x00],[0x66,0x66,0x66,0x3C,0x18,0x18,0x18,0x00],[0x7E,0x06,0x0C,0x18,0x30,0x60,0x7E,0x00],[0x3C,0x30,0x30,0x30,0x30,0x30,0x3C,0x00],[0x00,0x60,0x30,0x18,0x0C,0x06,0x00,0x00],[0x3C,0x0C,0x0C,0x0C,0x0C,0x0C,0x3C,0x00],[0x18,0x3C,0x66,0x00,0x00,0x00,0x00,0x00],[0x00,0x00,0x00,0x00,0x00,0x00,0x00,0xFF],[0x30,0x18,0x0C,0x00,0x00,0x00,0x00,0x00],[0x00,0x00,0x3C,0x06,0x3E,0x66,0x3E,0x00],[0x60,0x60,0x7C,0x66,0x66,0x66,0x7C,0x00],[0x00,0x00,0x3C,0x60,0x60,0x60,0x3C,0x00],[0x06,0x06,0x3E,0x66,0x66,0x66,0x3E,0x00],[0x00,0x00,0x3C,0x66,0x7E,0x60,0x3C,0x00],[0x1C,0x30,0x7C,0x30,0x30,0x30,0x30,0x00],[0x00,0x00,0x3E,0x66,0x66,0x3E,0x06,0x3C],[0x60,0x60,0x7C,0x66,0x66,0x66,0x66,0x00],[0x18,0x00,0x38,0x18,0x18,0x18,0x3C,0x00],[0x0C,0x00,0x1C,0x0C,0x0C,0x0C,0x0C,0x38],[0x60,0x60,0x66,0x6C,0x78,0x6C,0x66,0x00],[0x38,0x18,0x18,0x18,0x18,0x18,0x3C,0x00],[0x00,0x00,0x6C,0xFE,0xD6,0xD6,0xC6,0x00],[0x00,0x00,0x7C,0x66,0x66,0x66,0x66,0x00],[0x00,0x00,0x3C,0x66,0x66,0x66,0x3C,0x00],[0x00,0x00,0x7C,0x66,0x66,0x7C,0x60,0x60],[0x00,0x00,0x3E,0x66,0x66,0x3E,0x06,0x06],[0x00,0x00,0x7C,0x66,0x60,0x60,0x60,0x00],[0x00,0x00,0x3C,0x60,0x3C,0x06,0x3C,0x00],[0x30,0x30,0x7C,0x30,0x30,0x30,0x1C,0x00],[0x00,0x00,0x66,0x66,0x66,0x66,0x3E,0x00],[0x00,0x00,0x66,0x66,0x66,0x3C,0x18,0x00],[0x00,0x00,0xC6,0xD6,0xD6,0xFE,0x6C,0x00],[0x00,0x00,0x66,0x3C,0x18,0x3C,0x66,0x00],[0x00,0x00,0x66,0x66,0x66,0x3E,0x06,0x3C],[0x00,0x00,0x7E,0x0C,0x18,0x30,0x7E,0x00],[0x0E,0x18,0x18,0x70,0x18,0x18,0x0E,0x00],[0x18,0x18,0x18,0x00,0x18,0x18,0x18,0x00],[0x70,0x18,0x18,0x0E,0x18,0x18,0x70,0x00],[0x3A,0x6E,0x00,0x00,0x00,0x00,0x00,0x00]];
          EOF

          # ФАЙЛ ГРАФИКИ
          cat > kernel/src/vga.rs << 'EOF'
          use core::ptr::write_volatile;
          use crate::font;
          pub unsafe fn draw_rect(fb: *mut u32, fb_w: u32, x: u32, y: u32, w: u32, h: u32, color: u32) {
              for iy in y..(y + h) {
                  for ix in x..(x + w) { write_volatile(fb.add((iy * fb_w + ix) as usize), color); }
              }
          }
          pub unsafe fn draw_char(fb: *mut u32, fb_w: u32, x: u32, y: u32, c: char, color: u32, scale: u32) {
              let bitmap = font::get_char_bitmap(c);
              for row in 0..8 {
                  for col in 0..8 {
                      if (bitmap[row] & (1 << (7 - col))) != 0 {
                          draw_rect(fb, fb_w, x + col * scale, y + (row as u32) * scale, scale, scale, color);
                      }
                  }
              }
          }
          pub unsafe fn draw_text(fb: *mut u32, fb_w: u32, x: u32, y: u32, text: &str, color: u32, scale: u32) {
              let mut cx = x;
              for c in text.chars() { draw_char(fb, fb_w, cx, y, c, color, scale); cx += 8 * scale; }
          }
          EOF

          # ФАЙЛ ВИРТУАЛЬНОЙ МАШИНЫ
          cat > kernel/src/vm.rs << 'EOF'
          use core::ptr::{read_volatile, write_volatile};
          use crate::vga;
          pub struct AetherVM { regs: [i32; 26], mem: [i32; 1024], seed: u32 }
          impl AetherVM {
              pub fn new() -> Self { Self { regs: [0; 26], mem: [0; 1024], seed: 12345 } }
              fn get_val(&self, s: &str) -> i32 {
                  let b = s.as_bytes();
                  if b.len() == 1 && b[0] >= b'a' && b[0] <= b'z' { return self.regs[(b[0] - b'a') as usize]; }
                  let mut v = 0; let mut sign = 1;
                  for (i, &ch) in b.iter().enumerate() {
                      if i==0 && ch==b'-' { sign = -1; continue; }
                      if ch >= b'0' && ch <= b'9' { v = v*10 + (ch-b'0') as i32; }
                  }
                  v * sign
              }
              pub unsafe fn run(&mut self, fb: *mut u32, kb: *mut u8, w: u32, h: u32, code: &str) {
                  let mut lines = [""; 64]; let mut lc = 0;
                  for l in code.split('\n') { if !l.trim().is_empty() && lc < 64 { lines[lc] = l.trim(); lc += 1; } }
                  let mut pc = 0;
                  let colors = [0xFF0D0D14, 0xFFFFFFFF, 0xFF4AF626, 0xFFF38BA8, 0xFF89B4FA, 0xFFF9E2AF, 0xFF94E2D5];
                  while pc < lc {
                      let key = read_volatile(kb); if key != 0 { write_volatile(kb, 0); }
                      let mut jumped = false;
                      let words: core::alloc::vec::Vec<&str> = lines[pc].split(' ').collect();
                      match words[0] {
                          "set" => { self.regs[(words[1].as_bytes()[0] - b'a') as usize] = self.get_val(words[2]); }
                          "clear" => { vga::draw_rect(fb, w, 0, 0, w, h, colors[self.get_val(words[1]) as usize % 7]); }
                          "text" => { vga::draw_text(fb, w, self.get_val(words[1]) as u32, self.get_val(words[2]) as u32, words[4], colors[self.get_val(words[3]) as usize % 7], 2); }
                          "delay" => { for _ in 0..(self.get_val(words[1]) * 50000) { core::hint::spin_loop(); } }
                          "exit" => break,
                          "jmp" => { pc = self.get_val(words[1]) as usize; jumped = true; }
                          _ => {}
                      }
                      if !jumped { pc += 1; }
                  }
              }
          }
          EOF

      # 2. СБОРКА ЯДРА (Rust)
      - name: Build Rust Kernel
        run: |
          cd kernel
          cargo build --release --target aarch64-unknown-none
          NDK_BIN=$(find $ANDROID_HOME/ndk -name "ld.lld" | head -n 1 | xargs dirname)
          OBJCOPY=$(find $ANDROID_HOME/ndk -name "llvm-objcopy" | head -n 1)
          $NDK_BIN/ld.lld -T linker.ld -o kernel.elf target/aarch64-unknown-none/release/libaetheria_kernel.a
          $OBJCOPY -O binary kernel.elf kernel.bin
          mkdir -p ../android/app/src/main/res/raw
          cp kernel.bin ../android/app/src/main/res/raw/kernel_bin

      # 3. СБОРКА ANDROID (APK)
      - name: Build Android APK
        run: |
          cd android
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          export PATH="$PWD/gradle-8.5/bin:$PATH"
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AetheriaOS-Final
          path: android/app/build/outputs/apk/debug/app-debug.apk
